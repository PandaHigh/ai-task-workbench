name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build shared types (required by engine/UI)
        run: npm run build --workspace=shared

      - name: Type check - engine
        run: cd src-engine && npx tsc --noEmit

      - name: Type check - UI
        run: cd src-ui && npx tsc --noEmit

      - name: Check Rust code
        working-directory: src-tauri
        run: cargo check

      - name: Run engine tests
        run: cd src-engine && npx vitest run

      - name: Run UI component tests
        run: cd src-ui && npx vitest run src/components

      - name: Build all
        run: npm run build

  e2e:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: cd src-ui && npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start engine
        run: cd src-engine && node dist/index.js &

      - name: Run E2E tests
        run: cd src-ui && npx playwright test
        env:
          CI: true
