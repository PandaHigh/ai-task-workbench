name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [20, 22]
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Type check - shared
        run: cd shared && npx tsc --noEmit

      - name: Type check - engine
        run: cd src-engine && npx tsc --noEmit

      - name: Type check - UI
        run: cd src-ui && npx tsc --noEmit

      - name: Check Rust code
        working-directory: src-tauri
        run: cargo check

      - name: Run tests
        run: npm test

      - name: Build UI
        run: cd src-ui && npx vite build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist-${{ matrix.node-version }}-${{ matrix.os }}
          path: src-ui/dist/
