name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check - shared
        run: cd shared && npx tsc --noEmit

      - name: Type check - engine
        run: cd src-engine && npx tsc --noEmit

      - name: Type check - UI
        run: cd src-ui && npx tsc --noEmit

      - name: Run engine tests
        run: cd src-engine && npx vitest run

      - name: Build UI
        run: cd src-ui && npx vite build
