name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''
      - run: npm install
      - run: cd shared && npx tsc --build
      - run: cd src-engine && npx tsc --noEmit
      - run: cd src-ui && npx tsc --noEmit
      - run: npm run build --workspace=src-engine
      - run: npm run build --workspace=src-ui
      - run: cd src-engine && npx vitest run
      - run: cd src-ui && npx vitest run src/components

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install
      - run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Task Workbench ${{ github.ref_name }}'
          releaseBody: |
            请根据操作系统下载对应安装包：

            - macOS (Apple Silicon): `.dmg`
            - macOS (Intel): `.dmg`
            - Windows: `.msi` 或 `.exe`
            - Linux: `.deb` 或 `.AppImage`

            Windows 首次启动需要联网下载 WebView2 运行时。
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
